worker_processes 1;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 15;

    server {
        listen 80;
        server_name _;

        location /prod/ {
            alias /userdata/prod/;
            autoindex on;
        }

        location /record/ {
            alias /userdata/record/;
            autoindex on;
        }

        location = /test.wav {
            alias /userdata/prod/test.wav;
        }
    }
}
